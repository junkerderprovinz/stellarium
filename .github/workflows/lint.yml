name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          # DL3008 = pin apt versions: not pinned, the base image and Debian
          #          trixie move on their own cadence.
          # DL3009 = clean apt lists after install: cleaned once in the final
          #          RUN, kept readable.
          # SC2086 = unquoted expansion: the word splitting is intended.
          ignore: DL3008,DL3009,SC2086
          failure-threshold: warning

  screen-size-tests:
    name: Screen size behaviour
    runs-on: ubuntu-latest
    # The tests only run a shell script; a hang must not sit in the queue for
    # the 6 h job default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run behaviour tests
        # Which screen size wins between the template's preset dropdown and its
        # free field, and what happens to a malformed one.
        run: bash tests/test-selkies-resolution.sh

  shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # All shell scripts shipped in the image: *.sh, the extensionless
          # s6-rc.d service scripts (run) and the openbox autostart. Shebangs are
          # honored; the with-contenv scripts carry a "shellcheck shell=bash"
          # directive.
          SCRIPTS=$(find rootfs -type f \( -name '*.sh' -o -name 'run' -o -name 'autostart' \))

          if [ -z "${SCRIPTS}" ]; then
            echo "ERROR: no shell scripts found, the find pattern is broken." >&2
            exit 1
          fi

          echo "Checking the following scripts:"
          echo "${SCRIPTS}"
          echo "---"

          # -S warning: fail on warnings and up
          # -x:         follow sourced files
          # -e SC1091:  allow sourcing files not present at lint time
          # shellcheck disable=SC2086
          shellcheck -S warning -x -e SC1091 ${SCRIPTS}

          echo "All scripts passed shellcheck."

  xml-validate:
    name: XML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate XML files
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          shopt -s nullglob
          found=0
          for f in $(find . -name '*.xml' -not -path './.git/*'); do
            echo "Checking $f"
            xmllint --noout "$f"
            found=1
          done
          [ "$found" -eq 0 ] && echo "No XML files in this repo (template lives in unraid-apps), nothing to validate."
          exit 0
